[package]
name = "taxillus"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
axum = "0.8.9"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chrono = "0.4.45"
ecb = { version = "0.2.1", features = ["alloc"] }
envy = "0.4.2"
hex = "0.4.3"
hmac = "0.13.0"
md5 = "0.8.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
trace = "0.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = "deny"
nursery = "deny"
